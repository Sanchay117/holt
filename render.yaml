# Render blueprint: New -> Blueprint -> pick this repo. Secrets are entered in Render's dashboard, not here.
services:
  - type: web
    name: holt
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: OTARI_API_KEY
        sync: false
      - key: HOLT_ACCESS_CODE
        sync: false
      - key: HOLT_GUARDRAIL_PROFILE
        value: lakera-guard
      - key: HOLT_END_USER_BUDGET
        sync: false
      - key: HOLT_MCP_SERVER_IDS
        sync: false
      # Hosted Otari workspaces refuse MCP servers named by URL, so DeepWiki goes in as a stored server
      # (Tools -> MCP servers) whose id is HOLT_MCP_SERVER_IDS. Set this to "1" only if your workspace allows it.
      - key: HOLT_DEEPWIKI_MCP
        value: "0"
